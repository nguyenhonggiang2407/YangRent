name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: housing-photo-browser-checks
          path: docs/screenshots/home-photos-*.png
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s tests -v

  demo-image:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --file Dockerfile.demo --tag yangrent-demo:ci .
      - name: Verify isolated demo starts
        run: |
          docker run --detach --name yangrent-demo --publish 127.0.0.1:10000:10000 yangrent-demo:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/api/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:10000/ | grep -qi '<!doctype html>'
          demo_asset_path=$(curl --fail --silent http://127.0.0.1:10000/ | grep -Eo '/assets/[^\"]+\.js' | head -n 1)
          test -n "$demo_asset_path"
          curl --fail --silent --output /dev/null "http://127.0.0.1:10000$demo_asset_path"
          curl --fail --silent http://127.0.0.1:10000/api/rooms | python -c 'import json,sys; d=json.load(sys.stdin); assert d["success"] and len(d["data"]["items"]) >= 6'
      - name: Container diagnostics
        if: failure()
        run: docker logs yangrent-demo
