services:
  - type: web
    name: yangrent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && PYTHONUTF8=1 python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
