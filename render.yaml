# Selected hosting: Render API + Cloudflare Pages frontend.
services:
  - type: web
    name: yangrent-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r requirements.txt
    startCommand: PYTHONUTF8=1 python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
